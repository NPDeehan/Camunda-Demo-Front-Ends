<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 820" width="1280" height="820" role="img" aria-labelledby="arch-title arch-desc" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
  <title id="arch-title">Cluster Health Explorer architecture</title>
  <desc id="arch-desc">The Cluster Health Explorer front end talks through an auth proxy to two Camunda clusters. Chat messages go to the agent process on cluster A. The health dashboard reads cluster B, the monitored cluster, through a read-only route. The agent also queries cluster B with its own REST tools. Slack, Microsoft Teams, email and other channels reach the same agent process through connectors.</desc>

  <defs>
    <marker id="a-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#003399"/></marker>
    <marker id="a-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0891b2"/></marker>
    <marker id="a-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/></marker>
    <marker id="a-slate" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker>
  </defs>

  <!-- Background (explicit, so it reads the same on light and dark pages) -->
  <rect x="0.5" y="0.5" width="1279" height="819" rx="16" fill="#ffffff" stroke="#e2e8f0"/>

  <text x="40" y="50" font-size="24" font-weight="700" fill="#0f172a">Cluster Health Explorer — architecture</text>
  <text x="40" y="76" font-size="14" fill="#475569">A health dashboard for one Camunda cluster, plus an omnichannel AI agent you can ask about it</text>

  <!-- ───────────── Other channels (omnichannel) ───────────── -->
  <rect x="700" y="96" width="540" height="84" rx="12" fill="#f1f5f9" stroke="#94a3b8" stroke-dasharray="6 5"/>
  <text x="716" y="118" font-size="11" font-weight="700" letter-spacing="0.08em" fill="#475569">OTHER CHANNELS — THE AGENT IS OMNICHANNEL</text>

  <g font-size="13" fill="#0f172a">
    <rect x="716" y="130" width="100" height="36" rx="18" fill="#ffffff" stroke="#94a3b8"/>
    <circle cx="734" cy="148" r="5" fill="#4a154b"/><text x="746" y="153">Slack</text>

    <rect x="824" y="130" width="148" height="36" rx="18" fill="#ffffff" stroke="#94a3b8"/>
    <circle cx="842" cy="148" r="5" fill="#5b5fc7"/><text x="854" y="153">Microsoft Teams</text>

    <rect x="980" y="130" width="92" height="36" rx="18" fill="#ffffff" stroke="#94a3b8"/>
    <circle cx="998" cy="148" r="5" fill="#64748b"/><text x="1010" y="153">Email</text>

    <rect x="1080" y="130" width="144" height="36" rx="18" fill="#ffffff" stroke="#94a3b8"/>
    <circle cx="1098" cy="148" r="5" fill="#fc5d0d"/><text x="1110" y="153">Any channel…</text>
  </g>

  <!-- ───────────── Front end ───────────── -->
  <rect x="40" y="214" width="300" height="359" rx="14" fill="#eff6ff" stroke="#003399" stroke-width="2"/>
  <text x="60" y="242" font-size="11" font-weight="700" letter-spacing="0.08em" fill="#003399">FRONT END</text>
  <text x="60" y="264" font-size="17" font-weight="700" fill="#0f172a">Cluster Health Explorer</text>
  <text x="60" y="282" font-size="12" fill="#475569">React + Vite · runs in the browser</text>

  <rect x="60" y="309" width="260" height="100" rx="9" fill="#ffffff" stroke="#003399"/>
  <text x="76" y="333" font-size="13" font-weight="700" fill="#003399">Cluster Agent chat</text>
  <g font-size="12" fill="#475569">
    <text x="76" y="355">Ask anything about the cluster</text>
    <text x="76" y="373">Click a tile to ask about it</text>
    <text x="76" y="391">Markdown answers · auto-retry</text>
  </g>

  <rect x="60" y="449" width="260" height="100" rx="9" fill="#ffffff" stroke="#003399"/>
  <text x="76" y="473" font-size="13" font-weight="700" fill="#003399">Health dashboard</text>
  <g font-size="12" fill="#475569">
    <text x="76" y="495">Status banner · topology grid</text>
    <text x="76" y="513">Health checks · workload · throughput</text>
    <text x="76" y="531">Refreshes every 30 s</text>
  </g>

  <rect x="40" y="590" width="300" height="40" rx="10" fill="#fff8d6" stroke="#FFCC00" stroke-width="1.5"/>
  <text x="190" y="615" font-size="12.5" font-weight="700" fill="#7a5b00" text-anchor="middle">This front end is one channel among many</text>

  <!-- ───────────── Auth proxy ───────────── -->
  <rect x="420" y="214" width="200" height="346" rx="14" fill="#f8fafc" stroke="#475569" stroke-width="2"/>
  <text x="440" y="242" font-size="11" font-weight="700" letter-spacing="0.08em" fill="#475569">AUTH PROXY</text>
  <text x="440" y="264" font-size="13" font-weight="700" fill="#0f172a">Express · port 3001</text>
  <g font-size="11.5" fill="#475569">
    <text x="440" y="286">Adds the OAuth credentials,</text>
    <text x="440" y="302">so the browser never sees them</text>
  </g>

  <rect x="432" y="330" width="176" height="58" rx="8" fill="#ffffff" stroke="#003399"/>
  <text x="444" y="353" font-size="13" font-weight="700" fill="#003399" font-family="Consolas, Monaco, monospace">/api/*</text>
  <text x="444" y="372" font-size="11" fill="#475569">cluster A · full access</text>

  <text x="440" y="424" font-size="11" fill="#64748b">Separate credentials and</text>
  <text x="440" y="440" font-size="11" fill="#64748b">token cache per cluster</text>

  <rect x="432" y="470" width="176" height="58" rx="8" fill="#ffffff" stroke="#0891b2"/>
  <text x="444" y="493" font-size="13" font-weight="700" fill="#0e7490" font-family="Consolas, Monaco, monospace">/api/monitor/*</text>
  <text x="444" y="512" font-size="11" fill="#475569">cluster B · read-only</text>

  <!-- ───────────── Cluster A: runs the agent ───────────── -->
  <rect x="700" y="214" width="540" height="290" rx="14" fill="#fff7ed" stroke="#fc5d0d" stroke-width="2"/>
  <text x="720" y="240" font-size="13" font-weight="700" letter-spacing="0.04em" fill="#c2410c">CAMUNDA CLUSTER A</text>
  <text x="720" y="258" font-size="12" fill="#9a3412">Where the agent process runs</text>

  <rect x="724" y="276" width="492" height="212" rx="10" fill="#ffffff" stroke="#fdba74"/>
  <text x="744" y="302" font-size="15" font-weight="700" fill="#0f172a">Camunda-Cluster-Explorer</text>
  <text x="1196" y="302" font-size="12" fill="#64748b" text-anchor="end">BPMN process</text>

  <rect x="744" y="318" width="452" height="158" rx="9" fill="#f5f3ff" stroke="#a56eff" stroke-width="1.5"/>
  <text x="760" y="342" font-size="13" font-weight="700" fill="#6d28d9">AI Agent · LLM + tools</text>
  <g font-size="12" fill="#0f172a" text-anchor="middle">
    <rect x="760" y="356" width="136" height="32" rx="8" fill="#ffffff" stroke="#c4b5fd"/><text x="828" y="376">Get REST API spec</text>
    <rect x="904" y="356" width="143" height="32" rx="8" fill="#ffffff" stroke="#c4b5fd"/><text x="975.500" y="376">Get call reference</text>
    <rect x="1055" y="356" width="130" height="32" rx="8" fill="#ffffff" stroke="#c4b5fd"/><text x="1120" y="376">GET · POST · PUT</text>

    <rect x="760" y="400" width="97" height="32" rx="8" fill="#ffffff" stroke="#c4b5fd"/><text x="808.500" y="420">Date &amp; time</text>
    <rect x="865" y="400" width="60" height="32" rx="8" fill="#ffffff" stroke="#c4b5fd"/><text x="895" y="420">Wait</text>
    <rect x="933" y="400" width="252" height="32" rx="8" fill="#c8e6c9" stroke="#205022"/><text x="1059" y="420">Display answer to user (user task)</text>
  </g>
  <text x="760" y="458" font-size="12" font-style="italic" fill="#6d28d9">One process, many channels — the web UI is just one of them</text>

  <!-- ───────────── Cluster B: the monitored cluster ───────────── -->
  <rect x="700" y="560" width="540" height="240" rx="14" fill="#ecfeff" stroke="#0891b2" stroke-width="2"/>
  <text x="720" y="586" font-size="13" font-weight="700" letter-spacing="0.04em" fill="#0e7490">CAMUNDA CLUSTER B — THE MONITORED CLUSTER</text>
  <text x="720" y="604" font-size="12" fill="#155e75">The cluster whose health you are watching</text>

  <rect x="724" y="622" width="492" height="158" rx="10" fill="#ffffff" stroke="#67e8f9"/>
  <text x="744" y="648" font-size="14" font-weight="700" fill="#0f172a">Orchestration Cluster REST API (v2)</text>
  <g font-size="12" fill="#0f172a" text-anchor="middle">
    <rect x="744" y="662" width="140" height="30" rx="8" fill="#ecfeff" stroke="#67e8f9"/><text x="814" y="681">Topology</text>
    <rect x="900" y="662" width="140" height="30" rx="8" fill="#ecfeff" stroke="#67e8f9"/><text x="970" y="681">Incidents</text>
    <rect x="1056" y="662" width="140" height="30" rx="8" fill="#ecfeff" stroke="#67e8f9"/><text x="1126" y="681">Failed jobs</text>
    <rect x="744" y="702" width="140" height="30" rx="8" fill="#ecfeff" stroke="#67e8f9"/><text x="814" y="721">Process instances</text>
    <rect x="900" y="702" width="140" height="30" rx="8" fill="#ecfeff" stroke="#67e8f9"/><text x="970" y="721">User tasks</text>
    <rect x="1056" y="702" width="140" height="30" rx="8" fill="#ecfeff" stroke="#67e8f9"/><text x="1126" y="721">Process definitions</text>
  </g>
  <text x="744" y="762" font-size="12" font-style="italic" fill="#64748b">…and every process you actually run here</text>

  <!-- ───────────── Connectors ───────────── -->
  <!-- 1: chat <-> agent process -->
  <g stroke="#003399" stroke-width="2.5" fill="none">
    <path d="M320,359 H432" marker-start="url(#a-blue)" marker-end="url(#a-blue)"/>
    <path d="M608,359 H724" marker-start="url(#a-blue)" marker-end="url(#a-blue)"/>
  </g>
  <text x="666" y="343" font-size="11" fill="#003399" text-anchor="middle">REST API</text>

  <!-- 3: dashboard <-> monitored cluster (read-only) -->
  <g stroke="#0891b2" stroke-width="2.5" fill="none">
    <path d="M320,499 H432" marker-start="url(#a-teal)" marker-end="url(#a-teal)"/>
    <path d="M608,499 H660 V700 H724" marker-start="url(#a-teal)" marker-end="url(#a-teal)"/>
  </g>
  <text x="668" y="538" font-size="11" fill="#0e7490">read-only</text>

  <!-- 2: the agent's own tools query the monitored cluster -->
  <path d="M1130,476 V622" stroke="#7c3aed" stroke-width="2.5" fill="none" marker-start="url(#a-purple)" marker-end="url(#a-purple)"/>
  <text x="1112" y="528" font-size="11.5" font-weight="600" fill="#6d28d9" text-anchor="end">The agent's REST tools query it</text>
  <text x="1112" y="544" font-size="11" fill="#64748b" text-anchor="end">HTTP connector + its own credentials</text>

  <!-- 4: other channels <-> the same agent process -->
  <path d="M1180,180 V276" stroke="#475569" stroke-width="2.5" fill="none" marker-start="url(#a-slate)" marker-end="url(#a-slate)"/>
  <text x="1164" y="205" font-size="11.5" font-weight="600" fill="#475569" text-anchor="end">connectors · messages</text>

  <!-- Numbered badges -->
  <g font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">
    <circle cx="666" cy="359" r="11" fill="#003399"/><text x="666" y="363.500">1</text>
    <circle cx="1130" cy="532" r="11" fill="#7c3aed"/><text x="1130" y="536.500">2</text>
    <circle cx="376" cy="499" r="11" fill="#0891b2"/><text x="376" y="503.500">3</text>
    <circle cx="1180" cy="228" r="11" fill="#475569"/><text x="1180" y="232.500">4</text>
  </g>

  <!-- ───────────── How it flows ───────────── -->
  <text x="40" y="668" font-size="11" font-weight="700" letter-spacing="0.08em" fill="#475569">HOW IT FLOWS</text>
  <g font-size="13" fill="#0f172a">
    <circle cx="52" cy="690" r="10" fill="#003399"/><text x="52" y="694" font-size="11" font-weight="700" fill="#fff" text-anchor="middle">1</text>
    <text x="72" y="695">Chat: the proxy starts the agent process on cluster A, then polls for its reply.</text>

    <circle cx="52" cy="718" r="10" fill="#7c3aed"/><text x="52" y="722" font-size="11" font-weight="700" fill="#fff" text-anchor="middle">2</text>
    <text x="72" y="723">The agent answers by calling cluster B's REST API with its own tools.</text>

    <circle cx="52" cy="746" r="10" fill="#0891b2"/><text x="52" y="750" font-size="11" font-weight="700" fill="#fff" text-anchor="middle">3</text>
    <text x="72" y="751">Dashboard: reads cluster B via the proxy's read-only route; no agent involved.</text>

    <circle cx="52" cy="774" r="10" fill="#475569"/><text x="52" y="778" font-size="11" font-weight="700" fill="#fff" text-anchor="middle">4</text>
    <text x="72" y="779">Slack, Teams, email… reach the same agent via connectors — same process, same tools.</text>
  </g>
</svg>
